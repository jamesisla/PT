version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sania-pet-db
    restart: always
    environment:
      POSTGRES_USER: saniauser
      POSTGRES_PASSWORD: saniapassword
      POSTGRES_DB: saniapetdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saniauser -d saniapetdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sania-pet-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://saniauser:saniapassword@db:5432/saniapetdb
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sania-pet-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:

